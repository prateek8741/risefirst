# RiseFirst source registry: which employer job boards we collect from.
#
# Admission policy (see README "Sources and compliance"):
#   - Only official, public, keyless job-board APIs the employer publishes through its ATS.
#   - The host must permit it in robots.txt; rate limits follow robots.txt Crawl-delay.
#   - No scraping of job portals (LinkedIn, Naukri, Indeed, Internshala, Glassdoor, Foundit).
#
# These 74 boards were measured on 2026-11-17 (spikes/sourcing/REPORT.md) to have open
# jobs in India. Add a board by appending an entry; set enabled: false to pause one.

boards:
