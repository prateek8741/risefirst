# RiseFirst: everything needed to run the site locally.
#   cp .env.example .env      # optional: add GEMINI_API_KEY for AI tagging
#   docker compose up --build
#   open http://localhost:3000   (API docs: http://localhost:8000/docs)

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: risefirst
      POSTGRES_PASSWORD: risefirst
      POSTGRES_DB: risefirst
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"  # 5433 on the host so it doesn't clash with a local Postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U risefirst"]
      interval: 3s
      retries: 20

  api:
    build: { context: ., dockerfile: backend/Dockerfile }
    env_file: [{ path: .env, required: false }]
    environment:
      DATABASE_URL: postgresql+psycopg://risefirst:risefirst@db:5432/risefirst
      CORS_ORIGINS: '["http://localhost:3000"]'
    depends_on:
      db: { condition: service_healthy }
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      retries: 20

  # Daily refresh: runs one ingestion on start, then every day at REFRESH_HOUR_IST (default 06:00 IST).
  worker:
    build: { context: ., dockerfile: backend/Dockerfile }
    env_file: [{ path: .env, required: false }]
    environment:
      DATABASE_URL: postgresql+psycopg://risefirst:risefirst@db:5432/risefirst
    depends_on:
      api: { condition: service_healthy }  # the api container applies migrations first
    command: ["risefirst", "schedule"]
    restart: unless-stopped

  web:
    build: { context: ./web }
    environment:
      API_URL: http://api:8000
    depends_on:
      api: { condition: service_healthy }
    ports:
      - "3000:3000"

volumes:
  pgdata:
